name: Docker image

# Builds the Docker image (without pushing it) to catch Dockerfile breakage.
# Kept out of ci.yml on purpose: the runners may have no Docker daemon, in
# which case the build is skipped with a notice instead of failing.

on:
  push:
    branches:
      - master
    paths:
      - Dockerfile
      - .dockerignore
      - mix.exs
      - mix.lock
      - config/**
      - rel/**
      - .forgejo/workflows/docker.yml
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - mix.exs
      - mix.lock
      - config/**
      - rel/**
      - .forgejo/workflows/docker.yml

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: docker:28-cli
      # Use the host's Docker daemon if the runner exposes it.
      volumes:
        - /var/run/docker.sock:/var/run/docker.sock
    steps:
      # nodejs for the JavaScript checkout action, git for the checkout
      - name: Install system dependencies
        run: apk add --no-cache git nodejs
      - uses: actions/checkout@v4
      - name: Build image
        run: |
          if ! docker info > /dev/null 2>&1; then
            echo "::warning::No Docker daemon available on this runner - image build skipped"
            exit 0
          fi
          docker build --pull -t sentinelix:ci .
          docker image rm sentinelix:ci
