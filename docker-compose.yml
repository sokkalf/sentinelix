# Sentinelix + PostgreSQL. Quick start:
#
#   cp .env.example .env    # then set SECRET_KEY_BASE, POSTGRES_PASSWORD, ...
#   docker compose up -d
#
# and open http://localhost:4000. See README.md for all settings.

services:
  app:
    build: .
    image: sentinelix:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${SENTINELIX_PORT:-4000}:4000"
    # Ping monitors open raw ICMP sockets. NET_RAW is in Docker's default
    # capability set; listed explicitly so it survives a `cap_drop: [ALL]`.
    cap_add:
      - NET_RAW
    env_file:
      - .env
    environment:
      DATABASE_URL: "ecto://sentinelix:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db/sentinelix"
      SECRET_KEY_BASE: "${SECRET_KEY_BASE:?set SECRET_KEY_BASE in .env (openssl rand -base64 48)}"
      PHX_HOST: "${PHX_HOST:-localhost}"
      PORT: "4000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:4000/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: sentinelix
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}"
      POSTGRES_DB: sentinelix
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinelix -d sentinelix"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db-data:
